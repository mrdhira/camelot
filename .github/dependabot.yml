version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/tests/playwright"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/camelot"
    schedule:
      interval: "weekly"
