name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release runs the same checks first

permissions:
  contents: read

jobs:
  check:
    name: quality gate (make check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: golangci-lint (install only; make check runs it)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true

      - name: govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: make check
        run: make check

  e2e:
    name: browser suite (make e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: tests/playwright/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: tests/playwright/pnpm-lock.yaml

      - name: browsers
        working-directory: tests/playwright
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium

      - name: make e2e
        run: make e2e

      - name: report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/playwright/test-results/
          retention-days: 7

  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner .
