name: Release

# A tag vX.Y.Z on a commit of main: the CI checks again, then binaries for
# Linux and macOS (amd64, arm64) with checksums on a GitHub release, and a
# multi-arch image ghcr.io/mrdhira/camelot:X.Y.Z (and :latest).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: # recovery: release an existing tag
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: build
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            name="camelot_${TAG#v}_${os}_${arch}"
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/mrdhira/camelot/services/camelot/cmd.Version=${TAG}" \
              -o "dist/$name/camelot" ./services/camelot
            cp README.md LICENSE.md "dist/$name/"
            GOOS=$os GOARCH=$arch scripts/notices > "dist/$name/THIRD_PARTY_NOTICES.md"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            rm -rf "dist/$name"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: services/camelot/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.TAG }}
            REVISION=${{ github.sha }}
